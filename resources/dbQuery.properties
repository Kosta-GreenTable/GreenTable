#user
query.userlogin=SELECT user_id,email FROM user_login WHERE email=? AND password=?
query.insertUser=INSERT INTO user_login(email, password, last_login) VALUES (?, ?, ?)
query.insertUserInfo=INSERT INTO user_infos(user_id, user_name, phone, zip_code, address, detail_address, order_count, total_amount, user_grade, point) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
query.findEmailByNamePhone=SELECT ul.email FROM user_login ul JOIN user_infos ui ON ul.user_id = ui.user_id WHERE ui.user_name=? AND ui.phone=?
query.findUserByEmailAndName=SELECT ul.user_id FROM user_login ul JOIN user_infos ui ON ul.user_id = ui.user_id WHERE ul.email=? AND ui.user_name=?
query.updateUser=UPDATE user_login SET status=?, user_type=?, provider=?, oauth_id=? WHERE user_id=?
query.deleteUser=DELETE FROM user_login WHERE user_id=?
query.findUserInfo=SELECT * FROM user_infos WHERE user_id = ?

# Product queries
product.getList=SELECT p.product_id, p.name, p.sub_name, p.price, p.discount_rate, p.category, p.stock, pi.image_name FROM products p LEFT JOIN product_images pi ON p.product_id = pi.product_id AND pi.is_main=1 ORDER BY p.product_id ASC LIMIT ?, ?
product.getDetail=SELECT p.*, pd.*, pi.image_name FROM products p JOIN product_details pd ON p.product_id = pd.product_id LEFT JOIN product_images pi ON p.product_id = pi.product_id WHERE p.product_id=? AND pi.is_main=1
product.getImages=SELECT products_image_id, image_name, is_main, product_id FROM product_images WHERE product_id=?
product.getCategoryList=SELECT p.product_id, p.name, p.sub_name, p.price, p.discount_rate, p.category, pi.image_name FROM products p LEFT JOIN product_images pi ON p.product_id = pi.product_id AND pi.is_main=1 WHERE p.category=? ORDER BY p.product_id ASC LIMIT ?, ?
product.getCategoryCount=SELECT COUNT(*) FROM products WHERE category=?
product.getCount=SELECT COUNT(*) FROM products
product.getByCategory=SELECT p.product_id, p.name, p.sub_name, p.price, p.discount_rate, p.category, pi.image_name, COALESCE(AVG(pr.rating), 0) as rating, COUNT(pr.review_id) as review_count FROM products p LEFT JOIN product_images pi ON p.product_id = pi.product_id AND pi.is_main=1 LEFT JOIN product_reviews pr ON p.product_id = pr.product_id WHERE p.category=? GROUP BY p.product_id ORDER BY p.product_id ASC LIMIT ?, ?
product.insert=INSERT INTO products (name, sub_name, price, stock, category, discount_rate) VALUES (?, ?, ?, ?, ?, ?)
product.insertDetail=INSERT INTO product_details (product_id, description, ingredients, kcal, amount, nutrition, created_date, updated_date) VALUES (?, ?, ?, ?, ?, ?, ?, ?)
product.insertImage=INSERT INTO product_images (image_name, is_main, product_id) VALUES (?, ?, ?)
product.update=UPDATE products SET name=?, sub_name=?, price=?, stock=?, category=?, discount_rate=? WHERE product_id=?
product.updateDetail=UPDATE product_details SET description=?, ingredients=?, kcal=?, amount=?, nutrition=?, updated_date=? WHERE product_id=?
product.deleteImages=DELETE FROM product_images WHERE product_id=?
product.delete=DELETE FROM products WHERE product_id=?


# ===== Farm Related Queries =====

# Get all farms list (for admin) - with sorting
farm.getAdminList=SELECT * FROM farms ORDER BY farm_id ASC

# Get only active farms (for users)
farm.selectActiveFarms=SELECT * FROM farms WHERE contract_status = '\uD65C\uC131' ORDER BY farm_id DESC

# Get farm details
farm.getDetail=SELECT * FROM farms WHERE farm_id = ?

# Get farm by ID
farm.getFarmById=SELECT * FROM farms WHERE farm_id = ?

# Get products by farm
farm.getFarmProducts=SELECT p.product_id, p.name, p.sub_name, p.price, p.discount_rate, p.category, pi.image_name FROM products p JOIN product_farms pf ON p.product_id = pf.product_id JOIN product_images pi ON p.product_id = pi.product_id WHERE pf.farm_id = ? AND pi.is_main = 1

# Register a new farm
farm.insertFarm=INSERT INTO farms (name, description, address, farm_img, latitude, longitude, contract_status, category) VALUES (?, ?, ?, ?, ?, ?, ?, ?)

# Update farm information
farm.updateFarm=UPDATE farms SET name=?, description=?, address=?, farm_img=?, latitude=?, longitude=?, contract_status=?, category=? WHERE farm_id=?

# Update farm status
farm.updateFarmStatus=UPDATE farms SET contract_status = ? WHERE farm_id = ?

# Delete farm
farm.deleteFarm=DELETE FROM farms WHERE farm_id = ?

# Get total farm count
farm.getTotalFarmCount=SELECT COUNT(*) FROM farms

# Get paginated farm list
farm.getFarmsByPage=SELECT * FROM farms ORDER BY farm_id ASC LIMIT ?, ?

# Farm management queries
farm.setVariable=SET @count = 0
farm.reorderIds=UPDATE farms SET farm_id = @count:=@count+1 ORDER BY farm_id
farm.resetAutoIncrement=ALTER TABLE farms AUTO_INCREMENT = 1

# Product recommendation queries
product.getRecommendedByCategory=SELECT p.product_id, p.name, p.price, p.discount_rate, \
(SELECT image_name FROM product_images WHERE product_id = p.product_id AND is_main = 1 LIMIT 1) as main_image \
FROM products p \
WHERE p.category = ? AND p.product_id != ? AND p.stock > 0 \
ORDER BY RAND() \
LIMIT ?

product.getRecommendedProducts=SELECT p.product_id, p.name, p.price, p.discount_rate, \
(SELECT image_name FROM product_images WHERE product_id = p.product_id AND is_main = 1 LIMIT 1) as main_image \
FROM products p \
WHERE p.product_id != ? AND p.category != ? AND p.stock > 0 \
ORDER BY RAND() \
LIMIT ?

# Cart queries
query.selectCart=SELECT c.product_id, c.quantity, p.name, p.price, p.discount_rate, pi.image_name FROM carts c JOIN products p ON c.product_id = p.product_id LEFT JOIN product_images pi ON p.product_id = pi.product_id AND pi.is_main = 1 WHERE c.user_id = ?
query.insertCart=INSERT INTO carts (quantity, product_id, user_id) VALUES (?,?,?) AS new ON DUPLICATE KEY UPDATE quantity = carts.quantity + new.quantity
query.updateCart=update carts set quantity = ? where user_id = ? and product_id = ?
query.deleteCart=delete from carts where user_id = ? and product_id = ?

# Order queries
query.createSeq=INSERT INTO order_seq (order_type) VALUES (?)
query.insertOrder=INSERT INTO orders (order_id, user_id, merchant_uid, customer_name, customer_phone, customer_email, recipient, recipient_phone, zip_code, address, address_detail, total_amount, used_point, guest_password) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?)
query.insertOrderDetail=INSERT INTO order_details (order_id, product_id, quantity, price) VALUES (?,?,?,?)
query.insertPayment=INSERT INTO payments (order_id, pay_method, paid_amount, payment_status, imp_uid, merchant_uid) VALUES (?,?,?,?,?,?)
query.updateUserOrderInfo=UPDATE user_infos SET order_count = order_count + 1, total_amount = total_amount + ? WHERE user_id = ?
query.updateUserPoint=UPDATE user_infos SET point = point - ? WHERE user_id = ?

query.selectOrderInfo=SELECT o.order_id, o.order_at, o.total_amount, o.order_status, o.merchant_uid, \
od.order_detail_id, od.product_id, od.quantity, od.price, \
p.name, pi.image_name \
FROM orders o JOIN order_details od ON o.order_id = od.order_id \
JOIN products p ON od.product_id = p.product_id \
LEFT JOIN product_images pi ON p.product_id = pi.product_id AND pi.is_main = 1 \
WHERE o.user_id = ? ORDER BY od.order_detail_id \





# Review queries
review.insert=INSERT INTO product_reviews (rating, content, product_id, order_detail_id, user_id) VALUES (?, ?, ?, ?, ?)
review.insertImage=INSERT INTO review_images (real_name, original_name, is_main, review_id) VALUES (?, ?, ?, ?)
review.getByProduct=SELECT pr.*, u.name as user_name FROM product_reviews pr JOIN user_login u ON pr.user_id = u.user_id WHERE pr.product_id = ? ORDER BY pr.created_at DESC LIMIT ?, ?
review.getByUser=SELECT pr.*, p.name as product_name, (SELECT image_name FROM product_images WHERE product_id = pr.product_id AND is_main = 1 LIMIT 1) as product_image FROM product_reviews pr JOIN products p ON pr.product_id = p.product_id WHERE pr.user_id = ? ORDER BY pr.created_at DESC
review.getById=SELECT * FROM product_reviews WHERE review_id = ?
review.getImages=SELECT * FROM review_images WHERE review_id = ?
review.update=UPDATE product_reviews SET rating = ?, content = ? WHERE review_id = ?
review.delete=DELETE FROM product_reviews WHERE review_id = ?
review.deleteImages=DELETE FROM review_images WHERE review_id = ?
review.count=SELECT COUNT(*) FROM product_reviews WHERE product_id = ?
review.isReviewable=SELECT COUNT(*) FROM order_details od JOIN orders o ON od.order_id = o.order_id LEFT JOIN product_reviews pr ON od.order_detail_id = pr.order_detail_id AND pr.product_id = od.product_id WHERE o.user_id = ? AND od.product_id = ? AND od.order_detail_id = ? AND pr.review_id IS NULL AND o.order_status = 'DELIVERED'
review.getWritableReviews=SELECT od.order_detail_id, o.order_at as order_date, p.product_id, p.name as product_name, p.price, (SELECT image_name FROM product_images WHERE product_id = p.product_id AND is_main = 1 LIMIT 1) as product_image, CONCAT('\uC218\uB7C9: ', od.quantity, '\uAC1C') as product_option, DATE_ADD(o.order_at, INTERVAL 30 DAY) as deadline FROM order_details od JOIN orders o ON od.order_id = o.order_id JOIN products p ON od.product_id = p.product_id LEFT JOIN product_reviews pr ON od.order_detail_id = pr.order_detail_id AND pr.product_id = od.product_id WHERE o.user_id = ? AND pr.review_id IS NULL AND o.order_status = 'DELIVERED' AND DATE_ADD(o.order_at, INTERVAL 30 DAY) >= CURDATE()
review.getLatestOrderDetailId=SELECT od.order_detail_id FROM order_details od JOIN orders o ON od.order_id = o.order_id WHERE o.user_id = ? AND od.product_id = ? AND o.order_status = '\uBC30\uC1A1\uC644\uB8CC' AND NOT EXISTS (SELECT 1 FROM product_reviews r WHERE r.order_detail_id = od.order_detail_id) ORDER BY o.order_at DESC LIMIT 1

# QnA queries
qna.insert=INSERT INTO product_qna (title, content, user_id, product_id) VALUES (?, ?, ?, ?)
qna.getByProduct=SELECT pq.*, u.name as user_name FROM product_qna pq JOIN user_login u ON pq.user_id = u.user_id WHERE pq.product_id = ? ORDER BY pq.created_at DESC LIMIT ?, ?
qna.getByUser=SELECT pq.*, p.name as product_name, (SELECT image_name FROM product_images WHERE product_id = pq.product_id AND is_main = 1 LIMIT 1) as product_image FROM product_qna pq JOIN products p ON pq.product_id = p.product_id WHERE pq.user_id = ? ORDER BY pq.created_at DESC
qna.getByUserWithFilter=SELECT pq.*, p.name as product_name, (SELECT image_name FROM product_images WHERE product_id = pq.product_id AND is_main = 1 LIMIT 1) as product_image FROM product_qna pq JOIN products p ON pq.product_id = p.product_id WHERE pq.user_id = ? AND pq.created_at >= DATE_SUB(CURDATE(), INTERVAL ? MONTH) AND (? = 'all' OR pq.is_answered = ?) ORDER BY pq.created_at DESC
qna.getById=SELECT * FROM product_qna WHERE qna_id = ?
qna.update=UPDATE product_qna SET title = ?, content = ? WHERE qna_id = ? AND user_id = ?
qna.delete=DELETE FROM product_qna WHERE qna_id = ? AND user_id = ?
qna.answer=UPDATE product_qna SET answer = ?, is_answered = 'Y', answered_at = NOW() WHERE qna_id = ?
qna.count=SELECT COUNT(*) FROM product_qna WHERE product_id = ?
qna.getProductList=SELECT product_id, name FROM products WHERE product_id IN (SELECT DISTINCT product_id FROM order_details od JOIN orders o ON od.order_id = o.order_id WHERE o.user_id = ? AND o.order_status = 'DELIVERED')