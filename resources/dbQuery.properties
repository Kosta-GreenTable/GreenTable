FROM user_login ul LEFT JOIN user_infos ui ON ul.user_id = ui.user_id \
WHERE 1=1 \
AND (? = '' OR (? = 'email' AND ul.email LIKE CONCAT('%', ?, '%')) OR (? = 'name' AND ui.user_name LIKE CONCAT('%', ?, '%')) OR (? = 'phone' AND ui.phone LIKE CONCAT('%', ?, '%'))) \
AND (? = '' OR ul.state = ?) \
ORDER BY ul.insert_date DESC LIMIT ?, ?

admin.getUserCount=SELECT COUNT(*) FROM user_login ul LEFT JOIN user_infos ui ON ul.user_id = ui.user_id \
WHERE 1=1 \
AND (? = '' OR (? = 'email' AND ul.email LIKE CONCAT('%', ?, '%')) OR (? = 'name' AND ui.user_name LIKE CONCAT('%', ?, '%')) OR (? = 'phone' AND ui.phone LIKE CONCAT('%', ?, '%'))) \
AND (? = '' OR ul.state = ?)

