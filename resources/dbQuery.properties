# User-related queries
user.login=SELECT user_id, email, password, user_type, status FROM user_login WHERE email=? AND status='\uC815\uC0C1'
user.insert=INSERT INTO user_login (email, password, last_login) VALUES (?, ?, NOW())
user.info.insert=INSERT INTO user_infos (user_id, user_name, phone) VALUES (?, ?, ?)
user.getId=SELECT user_id FROM user_login WHERE email=?
user.getInfo=SELECT u.user_id, u.email, i.user_name, i.phone, i.zip_code, i.address, i.detail_address, i.user_grade, i.point FROM user_login u JOIN user_infos i ON u.user_id = i.user_id WHERE u.user_id=?
user.updateInfo=UPDATE user_infos SET user_name=?, phone=?, zip_code=?, address=?, detail_address=? WHERE user_id=?
user.updatePassword=UPDATE user_login SET password=? WHERE user_id=?
user.delete=UPDATE user_login SET status='\uD0C8\uD1F4' WHERE user_id=?

# Product queries
product.getList=SELECT p.product_id, p.name, p.sub_name, p.price, p.discount_rate, p.category, p.stock, pi.image_name FROM products p LEFT JOIN product_images pi ON p.product_id = pi.product_id AND pi.is_main=1 ORDER BY p.product_id ASC LIMIT ?, ?
product.getDetail=SELECT p.*, pd.*, pi.image_name FROM products p JOIN product_details pd ON p.product_id = pd.product_id LEFT JOIN product_images pi ON p.product_id = pi.product_id WHERE p.product_id=? AND pi.is_main=1
product.getImages=SELECT products_image_id, image_name, is_main, product_id FROM product_images WHERE product_id=?
product.getCategoryList=SELECT p.product_id, p.name, p.sub_name, p.price, p.discount_rate, p.category, pi.image_name FROM products p LEFT JOIN product_images pi ON p.product_id = pi.product_id AND pi.is_main=1 WHERE p.category=? ORDER BY p.product_id ASC LIMIT ?, ?
product.getCategoryCount=SELECT COUNT(*) FROM products WHERE category=?
product.getCount=SELECT COUNT(*) FROM products

# \uB204\uB77D\uB41C \uCFFC\uB9AC \uCD94\uAC00
product.getByCategory=SELECT p.product_id, p.name, p.sub_name, p.price, p.discount_rate, p.category, pi.image_name, COALESCE(AVG(pr.rating), 0) as rating, COUNT(pr.review_id) as review_count FROM products p LEFT JOIN product_images pi ON p.product_id = pi.product_id AND pi.is_main=1 LEFT JOIN product_reviews pr ON p.product_id = pr.product_id WHERE p.category=? GROUP BY p.product_id ORDER BY p.product_id ASC LIMIT ?, ?

product.insert=INSERT INTO products (name, sub_name, price, stock, category, discount_rate) VALUES (?, ?, ?, ?, ?, ?)
product.insertDetail=INSERT INTO product_details (product_id, description, ingredients, kcal, amount, nutrition, created_date, updated_date) VALUES (?, ?, ?, ?, ?, ?, ?, ?)
product.insertImage=INSERT INTO product_images (image_name, is_main, product_id) VALUES (?, ?, ?)
product.update=UPDATE products SET name=?, sub_name=?, price=?, stock=?, category=?, discount_rate=? WHERE product_id=?
product.updateDetail=UPDATE product_details SET description=?, ingredients=?, kcal=?, amount=?, nutrition=?, updated_date=? WHERE product_id=?
product.deleteImages=DELETE FROM product_images WHERE product_id=?
product.delete=DELETE FROM products WHERE product_id=?

# Cart queries
query.selectCart=SELECT c.quantity, p.name, p.price, p.discount_rate, pi.image_name FROM carts c JOIN products p ON c.product_id = p.product_id LEFT JOIN product_images pi ON p.product_id = pi.product_id AND pi.is_main = 1 WHERE c.user_id = ?
query.insertCart=INSERT INTO carts (quantity, product_id, user_id) VALUES (?,?,?) AS new ON DUPLICATE KEY UPDATE quantity = carts.quantity + new.quantity
query.updateCart=update carts set quantity = ? where user_id = ? and product_id = ?
query.deleteCart=delete from carts where user_id = ? and product_id = ?

# Order queries
order.createSeq=INSERT INTO order_seq (order_type) VALUES ('\uC77C\uBC18')
order.getSeq=SELECT LAST_INSERT_ID()
order.insert=INSERT INTO orders (order_id, order_code, order_name, order_phone, zip_code, shipping_address, detail_address, total_price, used_point, user_id) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
order.insertDetail=INSERT INTO order_details (order_id, product_id, quantity, price) VALUES (?, ?, ?, ?)
order.getList=SELECT o.order_id, o.order_code, o.total_price, o.order_status, o.order_date FROM orders o WHERE o.user_id=? ORDER BY o.order_date DESC
order.getDetail=SELECT o.*, od.quantity, od.price, p.name, p.product_id, pi.image_name FROM orders o JOIN order_details od ON o.order_id = od.order_id JOIN products p ON od.product_id = p.product_id JOIN product_images pi ON p.product_id = pi.product_id WHERE o.order_id=? AND pi.is_main=1

# Payment queries
payment.insert=INSERT INTO payments (payment_method, payment_price, payment_status, approval_code, order_id) VALUES (?, ?, '\uACB0\uC81C \uC131\uACF5', ?, ?)

# Review queries
review.insert=INSERT INTO product_reviews (rating, content, product_id, order_detail_id, user_id) VALUES (?, ?, ?, ?, ?)
review.insertImage=INSERT INTO review_images (real_name, original_name, review_id, is_main) VALUES (?, ?, ?, ?)
review.getList=SELECT r.review_id, r.rating, r.content, r.created_at, u.user_name, p.name FROM product_reviews r JOIN user_infos u ON r.user_id = u.user_id JOIN products p ON r.product_id = p.product_id WHERE r.product_id=? ORDER BY r.created_at DESC

# Subscription queries
subscription.getList=SELECT s.subscription_id, s.name, s.price, s.discount_rate, si.image_name FROM subscriptions s JOIN subscription_images si ON s.subscription_id = si.subscription_id WHERE si.is_main=1
subscription.getDetail=SELECT s.*, si.image_name FROM subscriptions s JOIN subscription_images si ON s.subscription_id = si.subscription_id WHERE s.subscription_id=? AND si.is_main=1
subscription.getProducts=SELECT p.product_id, p.name, p.price, p.category, pi.image_name FROM subscription_details sd JOIN products p ON sd.product_id = p.product_id JOIN product_images pi ON p.product_id = pi.product_id WHERE sd.subscription_id=? AND pi.is_main=1

# Notice and Event queries
notice.getList=SELECT notice_id, title, created_at, read_count FROM notice ORDER BY notice_id DESC LIMIT ?, ?
notice.getCount=SELECT COUNT(*) FROM notice
notice.getDetail=SELECT * FROM notice WHERE notice_id=?
notice.updateReadCount=UPDATE notice SET read_count = read_count + 1 WHERE notice_id=?

event.getList=SELECT event_id, title, event_image, start_date, end_date FROM events ORDER BY event_id DESC LIMIT ?, ?
event.getCount=SELECT COUNT(*) FROM events
event.getDetail=SELECT * FROM events WHERE event_id=?
event.updateReadCount=UPDATE events SET read_count = read_count + 1 WHERE event_id=?

# Farm queries
farm.getList=SELECT * FROM farms WHERE contract_status='\uD65C\uC131' ORDER BY farm_id DESC
farm.getDetail=SELECT f.*, p.product_id, p.name FROM farms f JOIN product_farms pf ON f.farm_id = pf.farm_id JOIN products p ON pf.product_id = p.product_id WHERE f.farm_id=?