# 통계 관련 쿼리들
# 일별 매출 통계
stats.daily.sales=SELECT DATE(order_at) as order_date, COUNT(*) as order_count, SUM(total_amount) as total_amount \
FROM orders \
WHERE DATE(order_at) BETWEEN ? AND ? AND order_status = 'DELIVERED' \
GROUP BY DATE(order_at) \
ORDER BY order_date

# 인기 상품 통계 (판매량 기준)
stats.top.products=SELECT p.name as product_name, SUM(od.quantity) as total_quantity, SUM(od.price * od.quantity) as total_revenue \
FROM order_details od \
JOIN products p ON od.product_id = p.product_id \
JOIN orders o ON od.order_id = o.order_id \
WHERE o.order_status = 'DELIVERED' \
GROUP BY p.product_id, p.name \
ORDER BY total_quantity DESC \
LIMIT ?

# 월별 매출 통계
stats.monthly.sales=SELECT MONTH(order_at) as month, COUNT(*) as order_count, SUM(total_amount) as total_amount \
FROM orders \
WHERE YEAR(order_at) = ? AND order_status = 'DELIVERED' \
GROUP BY MONTH(order_at) \
ORDER BY month

# 카테고리별 통계
stats.category=SELECT p.category, COUNT(DISTINCT p.product_id) as product_count, COALESCE(SUM(od.price * od.quantity), 0) as total_sales \
FROM products p \
LEFT JOIN order_details od ON p.product_id = od.product_id \
LEFT JOIN orders o ON od.order_id = o.order_id AND o.order_status = 'DELIVERED' \
GROUP BY p.category \
ORDER BY total_sales DESC

# 사용자 등록 통계
stats.user.registration=SELECT DATE(created_at) as registration_date, COUNT(*) as user_count \
FROM user_login \
WHERE DATE(created_at) BETWEEN ? AND ? \
GROUP BY DATE(created_at) \
ORDER BY registration_date

# 총 매출
stats.total.revenue=SELECT COALESCE(SUM(total_amount), 0) as total_revenue \
FROM orders \
WHERE order_status = 'DELIVERED'

# 주문 상태별 통계
stats.order.status=SELECT order_status as status, COUNT(*) as count \
FROM orders \
GROUP BY order_status

# 상품 판매 순위
stats.product.ranking=SELECT p.name as product_name, SUM(od.quantity) as total_quantity, \
SUM(od.price * od.quantity) as total_revenue, p.category \
FROM order_details od \
JOIN products p ON od.product_id = p.product_id \
JOIN orders o ON od.order_id = o.order_id \
WHERE o.order_status = 'DELIVERED' \
GROUP BY p.product_id, p.name, p.category \
ORDER BY total_revenue DESC \
LIMIT ?

# ===== Point System Queries =====

# 포인트 내역 조회
point.getHistoryByUserId=SELECT ph.*, \
CASE \
    WHEN ph.point_amount > 0 THEN CONCAT('+', ph.point_amount) \
    ELSE CAST(ph.point_amount AS CHAR) \
END as formatted_amount \
FROM point_history ph \
WHERE ph.user_id = ? \
ORDER BY ph.created_at DESC

# 포인트 적립 내역 추가
point.insertEarnHistory=INSERT INTO point_history (user_id, point_amount, description, order_no, transaction_type) \
VALUES (?, ?, ?, ?, 'EARN')

# 포인트 사용 내역 추가
point.insertUseHistory=INSERT INTO point_history (user_id, point_amount, description, order_no, transaction_type) \
VALUES (?, ?, ?, ?, 'USE')

# 사용자 포인트 잔액 조회
point.getUserBalance=SELECT COALESCE(point, 0) as point FROM user_infos WHERE user_id = ?

# 사용자 포인트 업데이트
point.updateUserPoint=UPDATE user_infos SET point = point + ? WHERE user_id = ?

# ===== Coupon System Queries =====

# 사용 가능한 쿠폰 조회
coupon.getAvailableByUserId=SELECT c.coupon_id, c.name, c.description, c.discount_type, c.discount_value, \
c.min_order_amount, c.max_discount_amount, ic.issued_coupon_id, ic.issue_date, c.valid_days, \
DATE_ADD(ic.issue_date, INTERVAL c.valid_days DAY) as expiry_date \
FROM issued_coupons ic \
JOIN coupons c ON ic.coupon_id = c.coupon_id \
WHERE ic.user_id = ? AND ic.is_used = 0 AND ic.is_expired = 0 \
AND DATE_ADD(ic.issue_date, INTERVAL c.valid_days DAY) > NOW() \
ORDER BY ic.issue_date DESC

# 사용한 쿠폰 조회
coupon.getUsedByUserId=SELECT c.coupon_id, c.name, c.description, c.discount_type, c.discount_value, \
c.min_order_amount, c.max_discount_amount, ic.issued_coupon_id, ic.issue_date, c.valid_days, \
ic.used_date, ic.order_no, \
DATE_ADD(ic.issue_date, INTERVAL c.valid_days DAY) as expiry_date \
FROM issued_coupons ic \
JOIN coupons c ON ic.coupon_id = c.coupon_id \
WHERE ic.user_id = ? AND ic.is_used = 1 \
ORDER BY ic.used_date DESC

# 만료된 쿠폰 조회
coupon.getExpiredByUserId=SELECT c.coupon_id, c.name, c.description, c.discount_type, c.discount_value, \
c.min_order_amount, c.max_discount_amount, ic.issued_coupon_id, ic.issue_date, c.valid_days, \
DATE_ADD(ic.issue_date, INTERVAL c.valid_days DAY) as expiry_date \
FROM issued_coupons ic \
JOIN coupons c ON ic.coupon_id = c.coupon_id \
WHERE ic.user_id = ? AND (ic.is_expired = 1 OR DATE_ADD(ic.issue_date, INTERVAL c.valid_days DAY) <= NOW()) \
ORDER BY ic.issue_date DESC

# 쿠폰 사용 처리
coupon.useCoupon=UPDATE issued_coupons SET is_used = 1, used_date = NOW(), order_no = ? WHERE issued_coupon_id = ?

# 쿠폰 발행
coupon.issueCoupon=INSERT INTO issued_coupons (user_id, coupon_id, issue_date) VALUES (?, ?, NOW())

# 쿠폰 코드로 쿠폰 등록
coupon.registerByCode=INSERT INTO issued_coupons (user_id, coupon_id, issue_date) \
SELECT ?, coupon_id, NOW() FROM coupons WHERE coupon_code = ? AND is_active = 1

